name: MLOps CI Pipeline

on:
  push:
    branches:
      - azure-mlops-cicd

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dataset
        run: python generate_data.py

      - name: Train model
        run: python train.py

      - name: Install DVC with Azure support
        run: pip install "dvc[azure]"

      - name: Configure DVC remote
        run: |
          dvc remote modify azureremote account_name ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          dvc remote modify --local azureremote account_key ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Push model to Azure Blob via DVC
        run: |
          dvc add models/churn_model.pkl
          dvc push

      - name: Upload model for KServe
        run: |
          pip install azure-storage-blob
          python - <<'PYEOF'
          from azure.storage.blob import BlobServiceClient
          import os
          conn_str = f"DefaultEndpointsProtocol=https;AccountName={os.environ['AZURE_STORAGE_ACCOUNT']};AccountKey={os.environ['AZURE_STORAGE_KEY']};EndpointSuffix=core.windows.net"
          client = BlobServiceClient.from_connection_string(conn_str)
          blob = client.get_blob_client(container="churn-model", blob="kserve-model/model.pkl")
          with open("models/churn_model.pkl", "rb") as f:
              blob.upload_blob(f, overwrite=True)
          print("Model uploaded to kserve-model/model.pkl")
          PYEOF
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ secrets.ACR_LOGIN_SERVER }}/churn-predictor:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update inference.yaml with new image tag
        run: |
          sed -i "s|image:.*|image: ${{ env.IMAGE_TAG }}|g" k8s/inference.yaml
          cat k8s/inference.yaml

      - name: Commit updated manifest
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add models/churn_model.pkl.dvc k8s/inference.yaml
          git commit -m "ci: update model and image tag ${{ github.sha }}" || echo "Nothing to commit"
          git push origin azure-mlops-cicd
